<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הגעה מוקדמת - עתידים</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Heebo', sans-serif; 
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            background: white; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .school-logo {
            width: 140px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
        }
        h2 { color: #2d3748; margin-top: 0; font-weight: 800; font-size: 26px; margin-bottom: 10px; }
        p.subtitle { 
            color: #4a5568; 
            font-size: 15px; 
            margin-bottom: 25px; 
            margin-top: 0; 
            font-weight: 600;
            line-height: 1.6;
        }
        .input-group { text-align: right; margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #4a5568; margin-bottom: 6px; padding-right: 4px; }
        input { 
            width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 14px; 
            box-sizing: border-box; font-size: 16px; font-family: 'Heebo', sans-serif;
            background: #f8fafc; transition: all 0.3s ease;
        }
        input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15); }
        input::placeholder { color: #a0aec0; }
        button.primary-btn { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 14px; font-size: 19px; font-weight: 800; 
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 15px;
            font-family: 'Heebo', sans-serif; box-shadow: 0 6px 20px rgba(118, 75, 162, 0.3);
        }
        button.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(118, 75, 162, 0.4); }
        button.primary-btn:active { transform: translateY(1px); }
        button.primary-btn:disabled { background: #cbd5e0; box-shadow: none; transform: none; cursor: not-allowed; }
        #status { 
            margin-top: 20px; font-weight: 600; font-size: 15px; min-height: 24px;
            padding: 10px; border-radius: 10px; transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image_2.png" alt="סמל ממשפחת עתידים" class="school-logo">
        <h2>רישום הגעה מוקדמת</h2>
        <p class="subtitle">
            תלמידים יקרים- התבקשתם להגיע מוקדם.<br>
            מלאו את שמכם המלא, הכיתה והמורה שהזמין אתכם מוקדם.<br>
            לחצו על "הגעתי" וזהו.<br>
            יום נעים ☀️
        </p>
        
        <div class="input-group">
            <label>איך קוראים לך?</label>
            <input type="text" id="studentName" placeholder="שם פרטי ומשפחה" required>
        </div>

        <div class="input-group">
            <label>באיזו כיתה את/ה?</label>
            <input type="text" id="studentClass" placeholder="למשל: ז'5, ח'1, ט'4" required>
        </div>

        <div class="input-group">
            <label>מי המורה שהזמין אותך?</label>
            <input type="text" id="teacherName" placeholder="שם המורה שהזמין/ה אותך מוקדם" required>
        </div>

        <button class="primary-btn" id="submitBtn" onclick="reportArrival()">הגעתי</button>
        <div id="status"></div>
    </div>

    <script>
        const SCHOOL_LAT = 32.017842;
        const SCHOOL_LNG = 34.768954;
        const MAX_RADIUS = 50; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWCcaFc7KDXhM1oMLSK4gPUKunJKVz0fv_JfVYOmQqoATv8ej97AyLk9EmKLzcslrJUQ/exec'; 

        function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function reportArrival() {
            const name = document.getElementById('studentName').value.trim();
            const cls = document.getElementById('studentClass').value.trim();
            const teacher = document.getElementById('teacherName').value.trim();
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            if (!name || !cls || !teacher) {
                statusDiv.innerText = "היי! חסרים פרטים, נא למלא את כל השדות 📝";
                statusDiv.style.color = "#e53e3e";
                statusDiv.style.background = "#fff5f5";
                return;
            }

            const today = new Date().toLocaleDateString('he-IL');
            if (localStorage.getItem('lastReportDate') === today) {
                statusDiv.innerText = "כבר דיווחת על הגעה היום! שיהיה יום מוצלח 🌟";
                statusDiv.style.color = "#d69e2e";
                statusDiv.style.background = "#fffff0";
                return;
            }

            btn.disabled = true;
            btn.innerText = "בודק מיקום... 📍";
            statusDiv.innerText = "מוודא שאת/ה נמצא/ת בשערי בית הספר...";
            statusDiv.style.color = "#4a5568";
            statusDiv.style.background = "transparent";

            if (!navigator.geolocation) {
                statusDiv.innerText = "הדפדפן שלך לא תומך בשירותי מיקום 😕";
                statusDiv.style.color = "#e53e3e";
                statusDiv.style.background = "#fff5f5";
                btn.disabled = false;
                btn.innerText = "הגעתי";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const distance = getDistanceFromLatLonInM(lat, lng, SCHOOL_LAT, SCHOOL_LNG);

                    if (distance > MAX_RADIUS) {
                        statusDiv.innerText = `את/ה רחוק/ה מדי מבית הספר
